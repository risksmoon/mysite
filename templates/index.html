<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Испытания</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .game {
            width: 420px;
            padding: 35px;

            background: white;
            border-radius: 24px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        .welcome {
            color: #555;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .crystals {
            display: inline-block;

            padding: 10px 18px;
            margin-bottom: 20px;

            background: #f3f4ff;
            border-radius: 12px;

            font-weight: bold;
        }

        .mode {
            width: 100%;
            padding: 17px;
            margin-top: 12px;

            border: none;
            border-radius: 14px;

            background: #667eea;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .mode:hover {
            background: #5568d9;
            transform: scale(1.02);
        }

        .result {
            margin-top: 20px;
            padding: 15px;

            background: #f3f4ff;
            border-radius: 12px;

            color: #333;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>🎮 Испытания</h1>

        {% if name %}
            <div class="welcome">
                👋 Привет, <strong>{{ name }}</strong>!
            </div>

            {% if age %}
                <div class="welcome">
                    Тебе {{ age }} лет.
                </div>
            {% endif %}
        {% endif %}

        <p class="subtitle">
            Выбери испытание и проверь свои знания!
        </p>

        <div class="crystals">
            💎 Кристаллы: 0
        </div>

        <button class="mode">
            🧠 Логика
        </button>

        <button class="mode">
            ➗ Математика
        </button>

        <button class="mode">
            🖼️ Угадай мультсериал
        </button>

    </div>

</body>
</html>
