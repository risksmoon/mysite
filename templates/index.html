<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Испытания</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .game {
            width: 420px;
            padding: 35px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .welcome {
            color: #555;
            font-size: 18px;
            margin: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
        }

        .continue {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .crystals {
            display: inline-block;
            padding: 10px 18px;
            margin: 15px 0;
            background: #f3f4ff;
            border-radius: 12px;
            font-weight: bold;
        }

        .mode {
            width: 100%;
            padding: 17px;
            margin-top: 12px;
            border: none;
            border-radius: 14px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="game">

    {% if not name %}

        <h1>🎮 Испытания</h1>

        <p class="subtitle">
            Сначала расскажи немного о себе
        </p>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Введите имя"
                required
            >

            <input
                type="number"
                name="age"
                placeholder="Введите возраст"
                min="1"
                max="120"
                required
            >

            <button class="continue" type="submit">
                Продолжить
            </button>

        </form>

    {% else %}

        <h1>🎮 Испытания</h1>

        <div class="welcome">
            👋 Привет, <strong>{{ name }}</strong>!
        </div>

        <div class="welcome">
            Тебе {{ age }} лет.
        </div>

        <p class="subtitle">
            Выбери испытание и проверь свои знания!
        </p>

        <div class="crystals">
            💎 Кристаллы: 0
        </div>

        <button class="mode">
            🧠 Логика
        </button>

        <button class="mode">
            ➗ Математика
        </button>

        <button class="mode">
            🖼️ Угадай мультсериал
        </button>

    {% endif %}

</div>

</body>
</html>
